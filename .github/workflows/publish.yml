name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-proxy-cli
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test deps
        run: python -m pip install -e . pytest build

      - name: Run tests
        run: python -m pytest tests/

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify published package
        run: |
          # Wait a few seconds for PyPI index to update
          sleep 10
          VERSION=${GITHUB_REF_NAME#v}
          python -m pip install --no-cache-dir llm-proxy-cli==$VERSION
          python -c "import llm_proxy_cli; assert llm_proxy_cli.__version__ == '$VERSION'"