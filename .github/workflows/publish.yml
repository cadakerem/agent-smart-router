name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llm-proxy-cli
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test deps
        run: python -m pip install -e . pytest build

      - name: Run tests
        run: python -m pytest tests/

      - name: Build a binary wheel and a source tarball
        run: python -m build

      - name: Check built wheel matches tag
        run: |
          VERSION=
          unzip -p dist/*.whl llm_proxy_cli.py | grep -q "__version__ = \"\""

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify published package (fresh env)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd "$RUNNER_TEMP"
          python -m venv verify-env
          for i in $(seq 1 12); do
            ./verify-env/bin/pip install --no-cache-dir "llm-proxy-cli==$VERSION" && break
            echo "Not on PyPI yet, retry $i..."; sleep 10
          done
          ./verify-env/bin/python -c "import llm_proxy_cli as m; assert m.__version__ == '$VERSION', m.__version__"